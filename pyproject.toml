[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlhf-flow-dpo"
version = "1.3.0"
description = "Distributed SFT & Direct Preference Optimization (DPO) Pipeline with Reference LogProb Caching"
authors = [{name = "suchitne99", email = "suchit.ne99@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "accelerate>=0.27.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
]

